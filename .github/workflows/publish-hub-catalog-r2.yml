name: Hub | Publish Catalog to R2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/generals-hub-online
    paths:
      - 'ios/hub/HubCatalog.json'
      - '.github/workflows/publish-hub-catalog-r2.yml'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('ios/hub/HubCatalog.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data.get('schemaVersion', 0) >= 2
          assert isinstance(data.get('mods'), list)
          print('catalogVersion=', data.get('catalogVersion'))
          PY

      - name: Check R2 secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$AWS_ACCESS_KEY_ID" || { echo 'Missing R2_ACCESS_KEY_ID'; exit 1; }
          test -n "$AWS_SECRET_ACCESS_KEY" || { echo 'Missing R2_SECRET_ACCESS_KEY'; exit 1; }
          test -n "$R2_BUCKET" || { echo 'Missing R2_BUCKET'; exit 1; }

      - name: Install AWS CLI
        run: python3 -m pip install --disable-pip-version-check awscli

      - name: Upload catalog
        run: |
          aws s3 cp ios/hub/HubCatalog.json "s3://${R2_BUCKET}/catalog.json" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache, max-age=60' \
            --no-progress
